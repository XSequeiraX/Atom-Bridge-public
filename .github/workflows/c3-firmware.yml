# Compila o programa do gateway C3 (app.py, netcfg.py) para .mpy com o mpy-cross do MicroPython do C3 (1.24.1) e guarda-o
# no repositorio, onde o Atom o vai buscar com o git pull. Compilar no proprio C3 gastava a memoria que o Wi-Fi e o
# Bluetooth precisam (2026-10-14). O main.py e o boot.py vao como codigo-fonte (sao pequenos).
name: C3 firmware

on:
  push:
    branches: [main]
    paths:
      - "c3_fiz_bm/app.py"
      - "c3_fiz_bm/netcfg.py"
      - ".github/workflows/c3-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  MPY_CROSS: "1.24.1.post3"         # tem de dar mpy v6.3, o formato do MicroPython 1.24.1 gravado nos C3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
      - name: Compilar
        run: |
          python3 -m venv /tmp/mpy
          /tmp/mpy/bin/pip install -q "mpy-cross==${MPY_CROSS}"
          /tmp/mpy/bin/mpy-cross --version | tee /tmp/versao
          grep -q "mpy v6.3" /tmp/versao || { echo "::error::mpy-cross does not emit mpy v6.3"; exit 1; }
          mkdir -p build
          for f in app netcfg; do
            /tmp/mpy/bin/mpy-cross -s "$f.py" -o "build/$f.mpy" "c3_fiz_bm/$f.py"   # -s: nos erros aparece app.py, como no C3
          done
          ls -l build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02      # v4
        with:
          name: c3-mpy
          path: build/*.mpy

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093      # v4
        with:
          name: c3-mpy
          path: build
      - name: Guardar no repositorio (o Atom busca-o com o git pull)
        run: |
          cp build/app.mpy build/netcfg.mpy c3_fiz_bm/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c3_fiz_bm/app.mpy c3_fiz_bm/netcfg.mpy
          for f in app netcfg; do
            git show ":c3_fiz_bm/$f.mpy" | cmp - "build/$f.mpy" || { echo "::error::$f.mpy changed by git"; exit 1; }
          done
          if git diff --cached --quiet; then echo "sem alteracoes"; exit 0; fi
          git commit -m "C3 firmware: app.mpy e netcfg.mpy compilados [skip ci]"
          for n in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((n * 5))
          done
          echo "::error::could not push the C3 firmware"; exit 1
