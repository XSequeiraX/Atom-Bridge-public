# Tampa do portatil (issue #19): fechar a tampa nao suspende o Atom. Sem isto o sistema suspende por omissao, o bridge pára,
# as camaras e o F6 perdem o controlo e uma gravacao em curso fica sem REC/STOP nem shoot log.
# Quem bloqueia a consola e apaga o ecra ao fechar e o servico bridge-brilho (atom/app/brilho.py).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
